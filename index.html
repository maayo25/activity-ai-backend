<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekomendasi Laptop AI</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #0f172a;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 213, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--primary);
            font-weight: 500;
        }

        #result-section {
            display: none;
            margin-top: 2.5rem;
            border-top: 2px dashed #e2e8f0;
            padding-top: 2rem;
        }

        .result-title {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            color: #0f172a;
        }

        .laptop-image-container {
            width: 100%;
            height: 350px;
            background-color: #f1f5f9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 1px solid #e2e8f0;
        }

        .laptop-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-placeholder {
            color: var(--text-light);
            font-size: 0.9rem;
            text-align: center;
            padding: 1rem;
        }

        .recommendation-text {
            line-height: 1.7;
            font-size: 1rem;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rekomendasi Laptop AI</h1>
        <p class="subtitle">Bagaimana merekomendasikan laptop sesuai kebutuhan pengguna dengan dukungan OpenAI dan fitur generasi gambar produk</p>

        <div class="form-group">
            <label for="needs">Ceritakan kebutuhan laptop Anda:</label>
            <textarea id="needs" placeholder="Contoh: Saya seorang mahasiswa teknik informatika yang butuh laptop untuk coding, sesekali edit video ringan, dan baterainya awet. Budget sekitar 12 jutaan..."></textarea>
        </div>

        <button id="submit-btn">Dapatkan Rekomendasi</button>

        <div class="loading" id="loader">Sedang menganalisis kebutuhan dan merancang visual laptop...</div>

        <div id="result-section">
            <h2 class="result-title">Laptop yang Direkomendasikan</h2>
            
            <div class="laptop-image-container">
                <div id="image-status" class="image-placeholder">Membuat visual produk...</div>
                <img id="laptop-img" src="" alt="Rekomendasi Laptop" style="display: none;">
            </div>

            <div class="recommendation-text" id="recommendation-output">
                </div>
        </div>
    </div>

    <script>
        document.getElementById('submit-btn').addEventListener('click', async () => {
            const needsText = document.getElementById('needs').value.trim();
            if (!needsText) return alert('Silakan isi kebutuhan Anda terlebih dahulu!');

            const submitBtn = document.getElementById('submit-btn');
            const loader = document.getElementById('loader');
            const resultSection = document.getElementById('result-section');
            const outputText = document.getElementById('recommendation-output');
            const laptopImg = document.getElementById('laptop-img');
            const imageStatus = document.getElementById('image-status');

            // Reset view
            submitBtn.disabled = true;
            loader.style.display = 'block';
            resultSection.style.style = 'none';
            laptopImg.style.display = 'none';
            imageStatus.style.display = 'block';
            imageStatus.innerText = "Membuat visual produk...";

            try {
                // 1. Panggil API Analisis Kebutuhan
                const analyzeRes = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: needsText })
                });
                const analyzeData = await analyzeRes.json();
                
                if(!analyzeRes.ok) throw new Error(analyzeData.error || 'Gagal menganalisis data');

                // Tampilkan text rekomendasi
                resultSection.style.display = 'block';
                outputText.innerText = analyzeData.result;

                // 2. Panggil API Generasi Gambar berdasarkan tipe laptop yang direkomendasikan
                // Kita ambil 100 karakter pertama hasil analisis untuk dijadikan prompt gambar yang relevan
                const imagePrompt = `A professional product photography of a modern laptop setup that matches: ${needsText}. Sleek design, photorealistic, 4k, studio lighting.`;
                
                const imageRes = await fetch('/api/generate-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: imagePrompt })
                });
                const imageData = await imageRes.json();

                if(imageRes.ok && imageData.imageUrl) {
                    laptopImg.src = imageData.imageUrl;
                    laptopImg.style.display = 'block';
                    imageStatus.style.display = 'none';
                } else {
                    imageStatus.innerText = "Gagal memuat gambar produk, namun teks rekomendasi tetap tersedia.";
                }

            } catch (error) {
                alert('Terjadi kesalahan: ' + error.message);
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
